<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniBot CRM</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --panel: #fffaf2;
        --border: #d6c4a4;
        --text: #2f2416;
        --muted: #6f604a;
        --accent: #b45f06;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top right, rgba(180, 95, 6, 0.18), transparent 25%),
          linear-gradient(180deg, #f7f1e7, #f3eadc);
        color: var(--text);
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(47, 36, 22, 0.08);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid rgba(214, 196, 164, 0.55);
        vertical-align: top;
      }

      th {
        background: rgba(180, 95, 6, 0.08);
        font-size: 0.9rem;
      }

      tbody tr:hover {
        background: rgba(180, 95, 6, 0.05);
      }

      .tag {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(180, 95, 6, 0.12);
        color: var(--accent);
        font-size: 0.8rem;
      }

      .muted {
        color: var(--muted);
      }

      select.status-select {
        font-family: inherit;
        font-size: 0.85rem;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
      }

      select.status-select:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .row-feedback {
        display: block;
        margin-top: 4px;
        font-size: 0.75rem;
        min-height: 0.95rem;
      }

      .row-feedback.ok {
        color: #2e7d32;
      }

      .row-feedback.err {
        color: #b3261e;
      }

      @media (max-width: 800px) {
        .panel {
          overflow-x: auto;
        }

        table {
          min-width: 760px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MiniBot Playlist CRM</h1>
      <p>Vista simple de contactos, conversaciones y canciones persistidas en PostgreSQL.</p>

      <section class="panel">
        <table>
          <thead>
            <tr>
              <th>Contacto</th>
              <th>Identificador</th>
              <th>Conversación</th>
              <th>Canción</th>
              <th>Estado</th>
              <th>Escuchada</th>
              <th>Cambiar estado</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="crm-body"></tbody>
        </table>
      </section>
    </main>

    <script src="/crm.js"></script>
  </body>
</html>
